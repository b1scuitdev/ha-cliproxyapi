name: Propose upstream update
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: app
      - run: python tests/update.py
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/upstream
          base: app
          commit-message: Update pinned official CLIProxyAPI release
          title: Update official CLIProxyAPI release
          body: |
            Review upstream release notes and run the Build, test and publish workflow on this branch before merging.
            GitHub's default automation token does not trigger pull_request workflows.
            After merge, both architecture smoke tests must pass before publication.
            Config and OAuth data are retained. No automatic merge or app installation.
