name: CLIProxyAPI
version: "8.0.67-1"
slug: cliproxyapi
description: Original CLIProxyAPI with persistent native configuration and OAuth storage
url: https://github.com/b1scuitdev/ha-cliproxyapi
arch:
  - aarch64
  - amd64
image: ghcr.io/b1scuitdev/ha-cliproxyapi
